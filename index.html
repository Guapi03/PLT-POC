<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Glass Lab — 玻璃仪器 3D / AR</title>
  <meta name="description" content="玻璃仪器 3D / AR 交互展示">
  <meta name="theme-color" content="#10191e">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2310191e'/%3E%3Cpath d='M12 6h8m-6 0v9L7 25h18l-7-10V6' fill='none' stroke='%237be6cc' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css?v=editor-7">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/examples/jsm/"}}</script>
</head>
<body>
<header class="header">
  <a class="brand" href="./" aria-label="Glass Lab 首页">
    <span class="brand-mark">G</span> GLASS<span class="brand-light"> / <span id="brand-category">LAB</span></span>
  </a>
  <div class="header-right">
    <button id="edit-model" class="secondary-button btn-sm" disabled>编辑模型 ↗</button>
    <button id="add-model" class="secondary-button btn-sm">＋ 添加模型</button>
    <button id="open-library" class="library-button" aria-label="搜索并选择模型">
      <span>模型库</span>
      <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
    </button>
  </div>
</header>

<main class="workspace">
  <section class="viewer" aria-label="三维模型视图">
    <div class="specimen">
      <h1 id="model-title">气体洗涤瓶</h1>
      <p class="spec" id="model-subtitle">500 mL <span>／</span> 24/29 磨口</p>
    </div>
    <div id="canvas-host" tabindex="0" aria-label="三维模型"></div>
    <div class="loading" id="loading" role="status">
      <div class="spinner"></div>
      <span id="load-message">正在载入…</span>
      <button class="text-button" id="retry" hidden>重新载入</button>
    </div>
    <div class="view-tools" role="group" aria-label="显示模式">
      <button class="view-choice active" data-view="glass" aria-pressed="true">玻璃</button>
      <button class="view-choice" data-view="original" aria-pressed="false">原始</button>
      <button class="view-choice" data-view="solid" aria-pressed="false">结构</button>
    </div>
    <div class="viewer-bottom">
      <span id="viewer-hint">拖动旋转 · 滚动缩放 · 点击部件</span>
      <button id="reset-camera" class="text-button">重置视角 ↺</button>
    </div>
    <span class="scale-note" id="scale-note">模型载入中</span>
  </section>

  <aside class="panel" aria-label="操作面板">
    <section class="control-section">
      <div class="section-heading">
        <h2>部件列表</h2>
        <span id="part-count" class="section-index">01—04</span>
      </div>
      <div id="part-list" class="part-list" role="group" aria-label="模型部件">
        <button class="part-button" data-part="bottle" aria-pressed="false"><span class="part-number">01</span><span>瓶身</span><span class="part-type">容器</span></button>
        <button class="part-button" data-part="head" aria-pressed="false"><span class="part-number">02</span><span>磨口上盖</span><span class="part-type">连接</span></button>
        <button class="part-button" data-part="long" aria-pressed="false"><span class="part-number">03</span><span>长导管</span><span class="part-type">深入瓶内</span></button>
        <button class="part-button" data-part="short" aria-pressed="false"><span class="part-number">04</span><span>短导管</span><span class="part-type">瓶内上部</span></button>
      </div>
      <div class="part-detail" aria-live="polite">
        <span id="detail-title">从外形，看到内部。</span>
        <p id="detail-copy">选择部件查看详情。</p>
      </div>

      <!-- 全局色彩主题切换 (Global Theme Switcher) -->
      <div id="color-palette-container" class="color-palette-compact">
        <div class="color-preview-group" title="当前主题颜色">
          <span id="color-circle" class="color-circle" style="background-color: #7BE6CC;"></span>
          <span id="color-hex-text" class="color-hex">#7BE6CC</span>
        </div>
        <span class="palette-title">色彩主题</span>
        <div class="color-actions-inline">
          <div class="color-swatches-inline">
            <button type="button" class="color-dot active" data-color="#7BE6CC" style="background-color: #7BE6CC;" title="薄荷绿"></button>
            <button type="button" class="color-dot" data-color="#FF4D4F" style="background-color: #FF4D4F;" title="珊瑚红"></button>
            <button type="button" class="color-dot" data-color="#1890FF" style="background-color: #1890FF;" title="科技蓝"></button>
            <button type="button" class="color-dot" data-color="#FAAD14" style="background-color: #FAAD14;" title="琥珀黄"></button>
            <button type="button" class="color-dot" data-color="#FFFFFF" style="background-color: #FFFFFF;" title="纯白色"></button>
          </div>
          <label class="custom-picker-wrapper" title="自定义主题色">
            <input type="color" id="custom-color-input" value="#7BE6CC">
            <span class="picker-icon">🎨</span>
          </label>
        </div>
      </div>
    </section>

    <section id="assembly-section" class="control-section assembly-controls">
      <div class="section-heading">
        <h2>装配观察</h2>
        <button class="text-button" id="assembly-toggle">展开部件 ↑</button>
      </div>
      <label class="range-label" for="lift">部件位移 <output id="lift-value" for="lift">0 <small>mm</small></output></label>
      <input id="lift" type="range" min="0" max="180" value="0" step="1" aria-label="部件位移">
      <div class="range-marks" aria-hidden="true"><span>组装</span><span id="lift-max">180 mm</span></div>
      <label class="switch-row" id="hide-parts-row">
        <span id="hide-parts-label">隐藏瓶身</span>
        <input id="hide-bottle" type="checkbox" role="switch">
        <span class="switch-track" aria-hidden="true"></span>
      </label>
    </section>

    <label class="switch-row rotate-row">
      <span>自动旋转</span>
      <input id="auto-rotate" type="checkbox" role="switch">
      <span class="switch-track" aria-hidden="true"></span>
    </label>

    <section class="ar-section">
      <p class="eyebrow">AR VIEW</p>
      <h2>空间预览</h2>
      <button class="primary-button" id="open-ar" disabled>在空间中查看 <span aria-hidden="true">↗</span></button>
      <p class="ar-note" id="ar-capability">载入后检查设备支持</p>
    </section>

    <footer class="panel-footer">
      <span id="model-note">尺寸估算值</span>
      <a id="download-model" href="./assets/glass-bottle.glb" download="glass-bottle.glb">下载 GLB ↓</a>
    </footer>
  </aside>
</main>

<!-- 1. 模型库弹窗 -->
<dialog id="library-dialog" class="model-editor-style" aria-labelledby="library-title">
  <div class="model-editor-form">
    <header class="editor-header">
      <div>
        <p class="eyebrow">MODEL LIBRARY</p>
        <h2 id="library-title">模型库</h2>
      </div>
      <button id="close-library" class="dialog-close" aria-label="关闭">×</button>
    </header>

    <div class="editor-fields">
      <div class="editor-body">
        <section class="editor-section editor-section-first">
          <div class="library-filter-row">
            <div class="editor-field">
              <label class="editor-field-title">搜索</label>
              <div class="search-input-wrapper">
                <span class="search-icon">🔍</span>
                <input id="library-search-input" type="search" placeholder="搜索模型名称...">
              </div>
            </div>
            <div class="editor-field">
              <label class="editor-field-title">分类筛选</label>
              <select id="library-category-select" class="styled-select">
                <option value="ALL">全部分类</option>
              </select>
            </div>
          </div>
        </section>

        <section class="editor-section">
          <div id="library-list" class="editor-group-list"></div>
        </section>
      </div>
    </div>

    <footer class="editor-footer">
      <p id="library-feedback" class="editor-feedback" role="status"></p>
      <div class="editor-actions">
        <button type="button" class="editor-button" onclick="document.querySelector('#library-dialog').close()">关闭</button>
      </div>
    </footer>
  </div>
</dialog>

<!-- 2. 添加模型弹窗 -->
<dialog id="upload-dialog" class="model-editor-style" aria-labelledby="upload-dialog-title">
  <form id="import-form" class="model-editor-form" novalidate>
    <header class="editor-header">
      <div>
        <p class="eyebrow">MODEL ADD</p>
        <h2 id="upload-dialog-title">添加模型</h2>
      </div>
      <button id="close-upload" type="button" class="dialog-close" aria-label="关闭">×</button>
    </header>

    <div class="editor-fields">
      <div class="editor-body">
        <section class="editor-section editor-section-first">
          <label class="drop-zone-card" id="drop-zone" for="model-file">
            <span class="upload-icon" aria-hidden="true">＋</span>
            <strong id="file-caption">选择或拖入 GLB 文件</strong>
            <span class="drop-hint">支持单个 .glb (最大 25 MiB)</span>
            <input id="model-file" type="file" accept=".glb,model/gltf-binary" required hidden>
          </label>
        </section>

        <section class="editor-section">
          <label class="editor-field">
            <span class="editor-field-title">模型名称</span>
            <input id="import-name" type="text" maxlength="80" placeholder="例如：玻璃漏斗" required>
          </label>

          <label class="editor-field">
            <span class="editor-field-title">模型类型 / 分类</span>
            <select id="import-category" class="styled-select"></select>
          </label>
        </section>
      </div>
    </div>

    <footer class="editor-footer">
      <p id="import-feedback" class="editor-feedback" role="status"></p>
      <div class="editor-actions">
        <button type="button" class="editor-button" onclick="document.querySelector('#upload-dialog').close()">取消</button>
        <button id="import-submit" class="editor-button editor-primary" type="submit">上传模型</button>
      </div>
    </footer>
  </form>
</dialog>

<!-- 3. AR 交互弹窗 -->
<dialog id="ar-dialog" aria-labelledby="ar-title">
  <button class="dialog-close" id="close-ar" aria-label="关闭">×</button>
  <p class="eyebrow">AUGMENTED REALITY</p>
  <h2 id="ar-title">空间预览</h2>
  <p id="ar-description"></p>
  <div id="ar-progress" hidden class="dialog-progress"><span class="spinner"></span><span>正在准备模型…</span></div>
  <button id="start-webxr" class="primary-button" hidden>打开相机并放置</button>
  <a id="quicklook-link" rel="ar" hidden aria-label="AR 中打开模型"><img alt="在相机中查看" width="320" height="52"></a>
  <div id="desktop-help" hidden>
    <label for="site-link">手机访问地址</label>
    <input id="site-link" readonly>
    <button id="copy-link" class="secondary-button">复制链接</button>
  </div>
  <p id="ar-feedback" class="dialog-feedback" role="status"></p>
</dialog>

<!-- XR AR 覆盖层 -->
<div id="xr-overlay" hidden>
  <div class="xr-top">
    <span id="xr-status">寻找平面中...</span>
    <button id="exit-ar">退出 AR</button>
  </div>
  <div class="xr-bottom">
    <button id="place-model" disabled>放置模型</button>
    <button id="replace-model" hidden>重新放置</button>
  </div>
</div>

<noscript><p class="no-script">请启用 JavaScript 以查看三维模型。</p></noscript>

<script type="module" src="./main.js"></script>
<script type="module">
  const libDialog = document.querySelector('#library-dialog');
  const uploadDialog = document.querySelector('#upload-dialog');

  document.querySelector('#open-library').onclick = () => libDialog.showModal();
  document.querySelector('#close-library').onclick = () => libDialog.close();
  document.querySelector('#add-model').onclick = () => uploadDialog.showModal();
  document.querySelector('#close-upload').onclick = () => uploadDialog.close();
</script>
</body>
</html>
